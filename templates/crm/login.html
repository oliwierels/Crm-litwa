<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Logowanie – 33bots LT CRM</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111318; color: #dde1f0;
       min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; font-size: 14px; }
.card { width: 100%; max-width: 360px; background: #1c1e26; border: 1px solid #2a2d38; border-radius: 12px; padding: 28px 24px; }
h1 { font-size: 18px; margin-bottom: 4px; }
.sub { color: #6b7080; font-size: 13px; margin-bottom: 20px; }
label { display: block; font-size: 12px; color: #8a8fa3; margin: 14px 0 6px; }
select, input { width: 100%; background: #23262f; border: 1px solid #2a2d38; color: #dde1f0; border-radius: 8px;
                padding: 10px 12px; font-size: 15px; outline: none; }
select:focus, input:focus { border-color: #5b5ef4; }
button { width: 100%; margin-top: 20px; background: #5b5ef4; color: #fff; border: none; border-radius: 8px;
         padding: 11px; font-size: 15px; font-weight: 600; cursor: pointer; }
button:hover { opacity: .9; }
.err { background: #ef444422; border: 1px solid #ef444466; color: #fca5a5; border-radius: 8px; padding: 9px 12px; font-size: 13px; margin-bottom: 4px; }
</style>
</head>
<body>
<form class="card" method="post" action="{{ url_for('crm_login') }}">
  <h1>🤖 33bots LT CRM</h1>
  <div class="sub">Zaloguj się, żeby wejść do CRM.</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="user_id">Kim jesteś</label>
  <select id="user_id" name="user_id">
    {% for u in users %}<option value="{{ u.id }}" {{ 'selected' if u.id == current.id }}>{{ u.name }}</option>{% endfor %}
  </select>
  <label for="password">Hasło</label>
  <input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
  <button type="submit">Zaloguj</button>
</form>
</body>
</html>
