<!DOCTYPE html>
<html lang="{{ fm_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ fm.title }}</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<style>
:root { --bg: #f5f6fa; --card: #fff; --text: #1d2130; --muted: #6b7080; --line: #e2e5ee; --accent: #5b5ef4; --green: #16a34a; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111318; --card: #1c1e26; --text: #dde1f0; --muted: #8a8fa0; --line: #2a2d38; --accent: #6d70ff; --green: #22c55e; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
.wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
.brand { font-weight: 800; font-size: 20px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
.brand img { width: 30px; height: 30px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
h1 { font-size: 20px; margin: 0 0 6px; }
p.sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 5px; }
input, textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
button { margin-top: 20px; width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer; }
label.check { display: flex; align-items: center; gap: 8px; color: var(--text); margin-top: 10px; cursor: pointer; }
label.check input { width: auto; }
details { margin-top: 16px; }
details summary { cursor: pointer; color: var(--accent); font-size: 14px; }
.ok { text-align: center; padding: 18px 6px; }
.ok .tick { font-size: 44px; color: var(--green); line-height: 1; }
.foot { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="{{ url_for('static', filename='favicon.svg') }}" alt=""> 33Bots</div>
  <div class="card">
  {% if done %}
    <div class="ok">
      <div class="tick">✓</div>
      <h1>{{ fm.done_h1 }}</h1>
      <p class="sub" style="margin:0">{{ fm.done_sub }}</p>
    </div>
  {% else %}
    <h1>{{ fm.h1 }}</h1>
    <p class="sub">{{ fm.sub }}</p>
    <form method="post">
      <label for="date">{{ fm.date }}</label>
      <input type="date" id="date" name="date" required>
      <label class="check"><input type="checkbox" id="multi" onchange="document.getElementById('to-wrap').hidden = !this.checked"> {{ fm.multi }}</label>
      <div id="to-wrap" hidden><label for="date_to">{{ fm.date_to }}</label><input type="date" id="date_to" name="date_to"></div>
      <label for="place">{{ fm.place }}</label>
      <input type="text" id="place" name="place" value="{{ fm_place }}" placeholder="{{ fm.place_ph }}" required maxlength="200">
      <div class="two">
        <div><label for="time_from">{{ fm.from }}</label><input type="time" id="time_from" name="time_from"></div>
        <div><label for="time_to">{{ fm.to }}</label><input type="time" id="time_to" name="time_to"></div>
      </div>
      <details>
        <summary>{{ fm.more }}</summary>
        <label for="kind">{{ fm.kind }}</label>
        <input type="text" id="kind" name="kind" placeholder="{{ fm.kind_ph }}" maxlength="200">
        <label for="guests">{{ fm.guests }}</label>
        <input type="text" id="guests" name="guests" inputmode="numeric" maxlength="50">
        <label for="comment">{{ fm.comment }}</label>
        <textarea id="comment" name="comment" rows="3" maxlength="500"></textarea>
      </details>
      <button type="submit">{{ fm.send }}</button>
    </form>
  {% endif %}
  </div>
  <div class="foot">33Bots · {{ fm_contact }}</div>
</div>
</body>
</html>
