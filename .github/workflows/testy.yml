# Testy CRM przy każdej zmianie: pełny pakiet (SQLite, bez internetu, bez wysyłki maili — patrz tests/conftest.py).
name: Testy
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
