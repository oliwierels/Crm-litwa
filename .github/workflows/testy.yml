# Testy CRM przy każdej zmianie: pełny pakiet na SQLite i drugi raz na Postgresie (jak produkcja na Railway) —
# bez internetu i bez wysyłki maili (patrz tests/conftest.py).
name: Testy
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
  testy-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/crm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
